<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Scanner & Gamified Payments</title>

<!-- PWA setup: lets the phone install this as a real app icon -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">

<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- Third-Party Core Engines (Loaded synchronously to resolve compilation errors) -->
<script src="https://jsdelivr.net"></script>
<script src="https://cloudflare.com"></script>

<style>
  :root {
    --bg-deep: #0b0e12;
    --bg-panel: #141821;
    --border: rgba(255,255,255,0.09);
    --accent: #00d9a3;
    --accent2: #7c5cff;
    --accent-dark: #06110d;
    --gold: #f59e0b;
    --text-hi: #f3f5f7;
    --text-mid: #9aa4b2;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--body);
    background: radial-gradient(circle at 50% -10%, var(--bg-panel), var(--bg-deep) 65%);
    color: var(--text-hi);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 18px 60px;
    overflow-x: hidden;
  }

  /* UPGRADE: Premium App-Wide Entrance Intro Transition Container */
  .page { 
    width: 100%; 
    max-width: 420px; 
    perspective: 1000px;
    opacity: 0;
    transform: translateY(24px) scale(0.98);
    animation: appEntranceIntro 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes appEntranceIntro {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Dynamic Header Stats Row */
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .coin-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    color: var(--gold);
    font-weight: 700;
  }

  header { position: relative; text-align: center; margin-bottom: 22px; }
  header::before {
    content: "";
    position: absolute;
    top: -70px;
    left: 50%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(0,217,163,0.28), rgba(124,92,255,0.16) 55%, transparent 72%);
    filter: blur(28px);
    transform: translateX(-50%);
    z-index: -1;
    pointer-events: none;
    animation: pulseGlow 4.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.65; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.08); }
  }
  
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent);
    margin: 0 0 8px 0;
  }
  h1 {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px 0;
  }
  h1 .accent {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    color: var(--text-mid);
    font-size: 14px;
    margin: 0;
  }

  .modeSelector {
    display: flex;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    margin: 22px 0 18px 0;
    gap: 4px;
  }
  .modeBtn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 6px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .modeBtn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #ffffff;
  }

  .viewfinder {
    position: relative;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 1 / 1;
  }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

  .corners { position: absolute; inset: 0; pointer-events: none; }
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid var(--accent);
    opacity: 0.9;
  }
  .corner.tl { top: 16px; left: 16px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner.tr { top: 16px; right: 16px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 16px; right: 16px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  /* UPGRADE: Hardware Accelerated Ultra-Smooth Scanning Laser Line Animation */
  .laser {
    position: absolute;
    left: 6%;
    width: 88%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 14px 3px var(--accent);
    top: 0;
    opacity: 0;
    will-change: transform;
  }
  .viewfinder.scanning .laser {
    opacity: 0.95;
    animation: smoothLaserSweep 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
  }
  @keyframes smoothLaserSweep {
    from { transform: translateY(25px); }
    to   { transform: translateY(375px); }
  }

  @keyframes framePulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(0,217,163,0.4), 0 0 26px 3px rgba(0,217,163,0.28); }
    50%      { box-shadow: 0 0 0 2px rgba(124,92,255,0.5), 0 0 32px 6px rgba(124,92,255,0.4); }
  }
  .viewfinder.scanning { animation: framePulse 2.2s ease-in-out infinite; }

  /* Generator Input Components Layout */
  .inputContainer {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  textarea {
    width: 100%;
    height: 100px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    color: var(--text-hi);
    font-family: var(--body);
    font-size: 14px;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  
  .generateBtn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    padding: 14px;
    color: white;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s;
  }
  .generateBtn:hover { opacity: 0.9; }
  
  #qrResult {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  /* Active Anime/Hero Canvas Overlay Popup System Layout */
  .animation-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 14, 18, 0.96);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 20px;
    padding: 20px;
  }
  
  /* Arc Reactor Visualization Graphic Rules */
  .arc-reactor {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px dashed var(--accent);
    box-shadow: 0 0 35px rgba(0,217,163,0.6);
    animation: rotateEngine 3s linear infinite;
    margin-bottom: 22px;
    transition: all 0.3s ease;
  }
  @keyframes rotateEngine { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Interactive Custom Cosmetics Shop Grid Layout */
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .shop-item { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: center; transition: all 0.2s ease; }
  .shop-item.equipped { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,217,163,0.15); }
  .price-tag { color: var(--gold); font-family: var(--mono); font-size: 13px; font-weight: bold; margin: 8px 0; }
  
  .action-btn {
    width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); padding: 9px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .action-btn:hover { background: rgba(255,255,255,0.12); }
  .action-btn.buy { background: var(--accent2); border: none; }
  .action-btn.buy:hover { opacity: 0.9; }

  .earn-ad-btn {
    width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; padding: 14px; border-radius: 14px; color: white; font-family: var(--display); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 18px; box-shadow: 0 4px 15px rgba(245,158,11,0.2);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="page">
  <!-- Dynamic Balance Header Component -->
  <div class="stats-header">
    <span style="font-size: 13px; color: var(--text-mid);">Theme Equipped: <b id="currentSkinText" style="color: #fff;">GREEN FLASH</b></span>
    <div class="coin-badge">
