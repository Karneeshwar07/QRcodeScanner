<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D QR Scanner - Hold then Disintegrate</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      color: #fff;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
    }

    #status-text {
      margin-top: 16px;
      font-size: 14px;
      color: #a0aec0;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Load Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <div class="controls">
    <button onclick="triggerScanAnimation()">Trigger Scan Detection</button>
  </div>

  <p id="status-text">Status: Ready to scan</p>

  <script>
    // --- 1. SETUP THREE.JS SCENE ---
    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('status-text');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0f111a, 0.05);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('three-canvas'),
      antialias: true,
      alpha: true
    });
    renderer.setSize(400, 400);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- 2. LIGHTING & 3D WHITE FRAME ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // Create White 3D Frame Box
    const frameGroup = new THREE.Group();
    const frameMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.1
    });

    // Outer Border Lines / Corner Brackets
    const boxGeo = new THREE.BoxGeometry(3.2, 3.2, 0.2);
    const boxEdges = new THREE.EdgesGeometry(boxGeo);
    const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
    const wireframeBox = new THREE.LineSegments(boxEdges, lineMat);
    frameGroup.add(wireframeBox);

    // Subtle White Backdrop Inside 3D Container
    const bgGeo = new THREE.PlaneGeometry(3, 3);
    const bgMat = new THREE.MeshBasicMaterial({ color: 0x1a1d2e, side: THREE.DoubleSide });
    const bgMesh = new THREE.Mesh(bgGeo, bgMat);
    bgMesh.position.z = -0.05;
    frameGroup.add(bgMesh);

    scene.add(frameGroup);

    // --- 3. GENERATE DUMMY QR CODE TEXTURE ---
    function createQRTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Draw Background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 256, 256);

      // Draw Dummy QR Pattern
      ctx.fillStyle = '#000000';
      const gridSize = 16;
      const cellSize = 256 / gridSize;

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          // Position markers at corners
          const isCorner = (r < 4 && c < 4) || (r < 4 && c > 11) || (r > 11 && c < 4);
          if (isCorner || Math.random() > 0.5) {
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    const qrTexture = createQRTexture();

    // Solid QR Plane inside the 3D Box
    const qrPlaneGeo = new THREE.PlaneGeometry(2.8, 2.8);
    const qrPlaneMat = new THREE.MeshBasicMaterial({
      map: qrTexture,
      transparent: true,
      opacity: 0 // Hidden initially
    });
    const qrMesh = new THREE.Mesh(qrPlaneGeo, qrPlaneMat);
    qrMesh.position.z = 0.01;
    scene.add(qrMesh);

    // --- 4. PARTICLE SYSTEM FOR DISINTEGRATION EFFECT ---
    const PARTICLE_COUNT = 1600; // 40x40 Grid
    const particleGeo = new THREE.BufferGeometry();
    
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const uvs = new Float32Array(PARTICLE_COUNT * 2);
    const alphas = new Float32Array(PARTICLE_COUNT);

    // Build particle initial coordinates matching QR plane geometry
    let pIndex = 0;
    const gridRes = 40;
    const step = 2.8 / gridRes;

    for (let i = 0; i < gridRes; i++) {
      for (let j = 0; j < gridRes; j++) {
        const x = -1.4 + j * step + step / 2;
        const y = 1.4 - i * step - step / 2;

        positions[pIndex * 3] = x;
        positions[pIndex * 3 + 1] = y;
        positions[pIndex * 3 + 2] = 0.01;

        // Spread velocities (moving outward toward the viewer)
        velocities[pIndex * 3] = (Math.random() - 0.5) * 0.04;
        velocities[pIndex * 3 + 1] = (Math.random() - 0.5) * 0.04;
        velocities[pIndex * 3 + 2] = Math.random() * 0.06 + 0.02; // Moving toward screen

        uvs[pIndex * 2] = j / gridRes;
        uvs[pIndex * 2 + 1] = 1.0 - (i / gridRes);

        alphas[pIndex] = 0.0; // Initially hidden

        pIndex++;
      }
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    particleGeo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

    // Custom Shader Material to sample QR texture onto moving particles
    const particleMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: qrTexture }
      },
      vertexShader: `
        attribute float alpha;
        varying vec2 vUv;
        varying float vAlpha;
        void main() {
          vUv = uv;
          vAlpha = alpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = (12.0 / -mvPosition.z); // Scale size with distance
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec2 vUv;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(uTexture, vUv);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false
    });

    const particlePoints = new THREE.Points(particleGeo, particleMaterial);
    scene.add(particlePoints);

    // --- 5. ANIMATION LOGIC & SEQUENCING ---
    let isExploding = false;
    let holdDuration = 800; // Pause duration in ms to see static QR in 3D frame

    function triggerScanAnimation() {
      // Step 1: Lock and Display the static QR code in the 3D frame
      statusText.innerText = "Status: QR Detected! Lock inside 3D frame...";
      qrMesh.material.opacity = 1.0;
      isExploding = false;

      // Reset particle positions & hidden state
      resetParticles();

      // Step 2: Hold state, then trigger piece disintegration
      setTimeout(() => {
        statusText.innerText = "Status: Disintegrating into particle pieces...";
        qrMesh.material.opacity = 0.0; // Hide static QR plane
        showParticles();
        isExploding = true;
      }, holdDuration);
    }

    function resetParticles() {
      const posAttr = particleGeo.attributes.position;
      const alphaAttr = particleGeo.attributes.alpha;
      
      let pIdx = 0;
      for (let i = 0; i < gridRes; i++) {
        for (let j = 0; j < gridRes; j++) {
          posAttr.setXYZ(pIdx, -1.4 + j * step + step / 2, 1.4 - i * step - step / 2, 0.01);
          alphaAttr.setX(pIdx, 0.0);
          pIdx++;
        }
      }
      posAttr.needsUpdate = true;
      alphaAttr.needsUpdate = true;
    }

    function showParticles() {
      const alphaAttr = particleGeo.attributes.alpha;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        alphaAttr.setX(i, 1.0);
      }
      alphaAttr.needsUpdate = true;
    }

    // --- 6. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Subtle 3D floating animation for frame
      frameGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
      frameGroup.rotation.x = Math.cos(Date.now() * 0.001) * 0.05;
      qrMesh.rotation.copy(frameGroup.rotation);

      // Animate particle fragmentation
      if (isExploding) {
        const posAttr = particleGeo.attributes.position;
        const alphaAttr = particleGeo.attributes.alpha;

        let activeCount = 0;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          let currentAlpha = alphaAttr.getX(i);

          if (currentAlpha > 0) {
            activeCount++;
            
            // Move particles outward and toward camera
            let x = posAttr.getX(i) + velocities[i * 3];
            let y = posAttr.getY(i) + velocities[i * 3 + 1];
            let z = posAttr.getZ(i) + velocities[i * 3 + 2];

            // Fade particles out gradually
            currentAlpha -= 0.015;

            posAttr.setXYZ(i, x, y, z);
            alphaAttr.setX(i, Math.max(0, currentAlpha));
          }
        }

        posAttr.needsUpdate = true;
        alphaAttr.needsUpdate = true;

        if (activeCount === 0) {
          isExploding = false;
          statusText.innerText = "Status: Animation complete! Result ready.";
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
