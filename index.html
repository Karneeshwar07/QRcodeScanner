<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Scanner</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- ZXing: QR/barcode reading library -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<!-- kjua: Lightweight & fast QR generator -->
<script src="https://cdn.jsdelivr.net/npm/kjua@0.9.0/dist/kjua.min.js"></script>

<style>
  :root {
    --bg-deep: #0b0e12;
    --bg-panel: #141821;
    --border: rgba(255,255,255,0.09);
    --accent: #00d9a3;
    --accent2: #7c5cff;
    --accent-dark: #06110d;
    --text-hi: #f3f5f7;
    --text-mid: #9aa4b2;
    --pay: #16a34a;
    --web: #2563eb;
    --call: #d97706;
    --mail: #7c3aed;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--body);
    background: radial-gradient(circle at 50% -10%, var(--bg-panel), var(--bg-deep) 65%);
    color: var(--text-hi);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 18px 60px;
    overflow-x: hidden;
  }

  .page { width: 100%; max-width: 420px; perspective: 1200px; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  header  { animation: fadeSlideUp 0.6s ease both; }
  #scanArea { animation: fadeSlideUp 0.6s ease both 0.12s; }

  header { position: relative; text-align: center; margin-bottom: 22px; }
  header::before {
    content: "";
    position: absolute;
    top: -70px;
    left: 50%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(0,217,163,0.28), rgba(124,92,255,0.16) 55%, transparent 72%);
    filter: blur(28px);
    transform: translateX(-50%);
    z-index: -1;
    pointer-events: none;
    animation: pulseGlow 4.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.65; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.08); }
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent);
    margin: 0 0 8px 0;
  }
  h1 {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px 0;
  }
  h1 .accent {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    color: var(--text-mid);
    font-size: 14px;
    margin: 0;
  }

  .modeSelector {
    display: flex;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    margin: 22px 0 18px 0;
    gap: 4px;
  }
  .modeBtn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 6px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .modeBtn.active {
    background: var(--accent);
    color: var(--accent-dark);
  }

  /* 3D Viewfinder Stage */
  .viewfinder {
    position: relative;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 1 / 1;
    perspective: 1000px;
    transform-style: preserve-3d;
  }
  .viewfinder::before {
    content: "";
    position: absolute;
    inset: -1.5px;
    border-radius: 21px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.55;
    pointer-events: none;
    z-index: 2;
  }
  #reader { width: 100%; height: 100%; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

  .corners { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid var(--accent);
    opacity: 0.9;
  }
  .corner.tl { top: 16px; left: 16px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner.tr { top: 16px; right: 16px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 16px; right: 16px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  .laser {
    position: absolute;
    left: 6%;
    width: 88%;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent);
    top: 10%;
    opacity: 0;
    z-index: 2;
  }
  .viewfinder.scanning .laser {
    opacity: 0.85;
    animation: sweep 2.2s ease-in-out infinite alternate;
  }
  @keyframes sweep {
    from { top: 10%; }
    to   { top: 88%; }
  }

  .viewfinder.scanning {
    animation: framePulse 2.2s ease-in-out infinite;
  }
  @keyframes framePulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(0,217,163,0.4), 0 0 26px 3px rgba(0,217,163,0.28); }
    50%      { box-shadow: 0 0 0 2px rgba(124,92,255,0.5), 0 0 32px 6px rgba(124,92,255,0.4); }
  }

  /* Paytm 3D Fragment Stage */
  .paytm3dStage {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    perspective: 1000px;
    transform-style: preserve-3d;
  }
  .qrFragment {
    position: absolute;
    background-color: #ffffff;
    background-size: cover;
    border: 1.5px solid #ffffff;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.95), 0 0 35px var(--accent);
    transition: transform 1.1s cubic-bezier(0.1, 0.8, 0.25, 1), opacity 1.1s ease-in-out;
    backface-visibility: visible;
  }

  .primaryBtn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: var(--accent);
    color: var(--accent-dark);
    border: none;
    border-radius: 14px;
    font-family: var(--body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(0,217,163,0.5);
  }
  .primaryBtn:disabled { background: #3a4048; color: var(--text-mid); box-shadow: none; cursor: default; }
  .primaryBtn.ghost {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    box-shadow: none;
  }

  .scanBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #ffffff;
    box-shadow: 0 10px 26px -8px rgba(124,92,255,0.55), 0 6px 18px -6px rgba(0,217,163,0.45);
    transition: transform 0.12s ease;
  }
  .scanBtn:active { transform: scale(0.97); }

  .status { text-align: center; color: var(--text-mid); font-size: 13px; margin: 10px 0 0 0; }
  .uploadSection { text-align: center; margin-top: 18px; }

  .tabBar {
    display: flex;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .tabBtn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--body);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 6px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .tabBtn.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff;
  }
  .tabPanel[hidden] { display: none; }
  .tabIntro { color: var(--text-mid); font-size: 13.5px; margin: 0 0 14px 0; }

  .torchBtn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    z-index: 3;
  }
  .torchBtn.on { background: var(--accent); color: var(--accent-dark); border-color: var(--accent); }

  .genInput {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text-hi);
    font-family: var(--body);
    font-size: 15px;
    padding: 14px;
    resize: vertical;
    box-sizing: border-box;
    margin-bottom: 14px;
  }
  .genInput:focus { outline: 2px solid var(--accent); }
  .genResult { margin-top: 20px; text-align: center; }
  .qrCanvasWrap {
    display: inline-block;
    background: #fff;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 20px 45px -12px rgba(0,0,0,0.6);
  }
  .qrCanvasWrap svg, .qrCanvasWrap canvas { display: block; max-width: 100%; height: auto; }
  .genActions { display: flex; gap: 10px; margin-top: 16px; }
  .genActions .secondaryBtn { flex: 1; }

  .historyHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .clearBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .historyEmpty { color: var(--text-mid); font-size: 13.5px; text-align: center; padding: 30px 10px; }
  .historyList { display: flex; flex-direction: column; gap: 10px; }
  .historyItem {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
  }
  .historyItem:hover { background: #1b202b; }
  .historyTop { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .historyTypeBadge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .historyTypeBadge.pay { background: rgba(22,163,74,0.18); color: #4ade80; }
  .historyTypeBadge.web { background: rgba(37,99,235,0.18); color: #7fa8ff; }
  .historyTypeBadge.call { background: rgba(217,119,6,0.18); color: #fbbf24; }
  .historyTypeBadge.mail { background: rgba(124,92,255,0.18); color: #b8a6ff; }
  .historyTypeBadge.text { background: rgba(0,217,163,0.18); color: var(--accent); }
  .historyTime { font-size: 11.5px; color: var(--text-mid); margin-left: auto; }
  .historyText {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-hi);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .orText { color: var(--text-mid); font-size: 12px; margin: 0 0 10px 0; }
  .secondaryBtn {
    display: inline-block;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-hi);
    padding: 11px 20px;
    border-radius: 12px;
    font-family: var(--body);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .ticket {
    position: relative;
    background: var(--bg-panel);
    color: var(--text-hi);
    margin-top: 10px;
    padding: 30px 20px 22px;
    border-radius: 20px;
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    box-shadow: 0 20px 45px -12px rgba(0,0,0,0.6);
  }
  .ticket::before {
    content: "";
    position: absolute;
    top: -50px;
    left: 50%;
    width: 280px;
    height: 200px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(0,217,163,0.35), transparent 70%);
    filter: blur(32px);
    z-index: -1;
    pointer-events: none;
  }
  @keyframes ticketFlipIn {
    from { opacity: 0; transform: rotateX(45deg) translateY(30px) scale(0.92); }
    to   { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }
  }
  .ticket.flipIn {
    transform-origin: top center;
    animation: ticketFlipIn 0.6s cubic-bezier(0.25, 0.7, 0.3, 1.05);
  }

  .ticketNotch {
    position: absolute;
    top: -12px;
    width: 22px;
    height: 22px;
    background: var(--bg-deep);
    border-radius: 50%;
  }
  .ticketNotch.left { left: 10px; }
  .ticketNotch.right { right: 10px; }
  .ticketLabel {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    color: #9aa4b2;
    margin: 0 0 14px 0;
  }

  #resultContent pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text-hi);
    background: var(--bg-deep);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 10px;
    margin: 0;
  }
  .actionBtn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: var(--body);
    font-size: 15.5px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
  }
  .actionBtn.pay { background: var(--pay); }
  .verifyBadge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(37,99,235,0.18);
    color: #7fa8ff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .actionBtn.web { background: var(--web); }
  .actionBtn.call { background: var(--call); }
  .actionBtn.mail { background: var(--mail); }

  .copyBtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-hi);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: var(--body);
    font-size: 13px;
    cursor: pointer;
  }
  .hintText { font-size: 12.5px; color: var(--text-mid); margin: 10px 0 0 0; line-height: 1.4; }
  .rawLink {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-mid);
    word-break: break-all;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <p class="eyebrow">UNIVERSAL SCANNER</p>
    <h1>Scan <span class="accent">anything</span></h1>
    <p class="sub">QR codes, barcodes, ID cards, payment codes.</p>
  </header>

  <div class="tabBar" role="tablist">
    <button class="tabBtn active" data-tab="scan" type="button">🔍 Scan</button>
    <button class="tabBtn" data-tab="generate" type="button">➕ Generate</button>
    <button class="tabBtn" data-tab="history" type="button">🕘 History</button>
  </div>

  <div id="scanTab" class="tabPanel">

    <div id="scanArea">
      <div class="modeSelector">
        <button class="modeBtn active" data-mode="auto" type="button">🔍 Auto</button>
        <button class="modeBtn" data-mode="qr" type="button">▭ QR Only</button>
        <button class="modeBtn" data-mode="barcode" type="button">▤ Barcode Only</button>
      </div>

      <div class="viewfinder" id="viewfinderWrap">
        <div id="reader"><video id="video" autoplay muted playsinline></video></div>
        <div class="corners">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
        <div class="laser"></div>
        <div id="paytm3dStage" class="paytm3dStage"></div>
        <button id="torchBtn" class="torchBtn" type="button" hidden aria-label="Toggle flashlight">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 2h6l-1 7h3l-8 13 1-9H7l2-11z" fill="currentColor"/></svg>
        </button>
      </div>

      <button id="startCameraBtn" class="primaryBtn scanBtn" type="button">
        <svg class="scanIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 8V5a1 1 0 0 1 1-1h3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M20 8V5a1 1 0 0 0-1-1h-3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M4 16v3a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M20 16v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
        </svg>
        <span id="startBtnLabel">Scan</span>
      </button>
      <p id="status" class="status">Choose a mode, then tap Scan.</p>

      <div class="uploadSection">
        <p class="orText">— or —</p>
        <label for="fileInput" class="secondaryBtn">📁 Upload a Photo</label>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </div>

    <div id="dashboard" class="ticket" hidden>
      <div class="ticketNotch left"></div>
      <div class="ticketNotch right"></div>
      <p class="ticketLabel">SCAN RESULT</p>
      <div id="resultContent"></div>
      <button id="scanAgainBtn" class="primaryBtn ghost" type="button">↻ Scan Again</button>
    </div>

  </div>

  <div id="generateTab" class="tabPanel" hidden>
    <p class="tabIntro">Type text or a link — get a QR code you can show or share.</p>
    <textarea id="genInput" class="genInput" rows="3" placeholder="Paste a link, or type anything…"></textarea>
    <button id="genBtn" class="primaryBtn scanBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="3" height="3" fill="currentColor"/><rect x="18" y="18" width="3" height="3" fill="currentColor"/></svg>
      <span>Generate QR</span>
    </button>

    <div id="genResult" class="genResult" hidden>
      <div class="qrCanvasWrap" id="qrCanvasContainer"></div>
      <div class="genActions">
        <button id="genShareBtn" class="secondaryBtn" type="button">📤 Share</button>
        <button id="genDownloadBtn" class="secondaryBtn" type="button">⬇️ Download</button>
      </div>
    </div>
  </div>

  <div id="historyTab" class="tabPanel" hidden>
    <div class="historyHeader">
      <p class="tabIntro" style="margin:0;">Everything you've scanned, saved on this device.</p>
      <button id="clearHistoryBtn" class="clearBtn" type="button">Clear</button>
    </div>
    <div id="historyList" class="historyList"></div>
    <p id="historyEmpty" class="historyEmpty">Nothing scanned yet — your scans will show up here.</p>
  </div>

</div>

<script>
  const statusEl = document.getElementById('status');
  const scanArea = document.getElementById('scanArea');
  const dashboard = document.getElementById('dashboard');
  const resultContent = document.getElementById('resultContent');
  const viewfinderWrap = document.getElementById('viewfinderWrap');
  const videoEl = document.getElementById('video');
  const paytm3dStage = document.getElementById('paytm3dStage');
  const fileInput = document.getElementById('fileInput');
  const startCameraBtn = document.getElementById('startCameraBtn');
  const startBtnLabel = document.getElementById('startBtnLabel');
  const modeButtons = document.querySelectorAll('.modeBtn');

  const tabButtons = document.querySelectorAll('.tabBtn');
  const scanTab = document.getElementById('scanTab');
  const generateTab = document.getElementById('generateTab');
  const historyTab = document.getElementById('historyTab');
  const torchBtn = document.getElementById('torchBtn');
  const genInput = document.getElementById('genInput');
  const genBtn = document.getElementById('genBtn');
  const genResult = document.getElementById('genResult');
  const qrCanvasContainer = document.getElementById('qrCanvasContainer');
  const genShareBtn = document.getElementById('genShareBtn');
  const genDownloadBtn = document.getElementById('genDownloadBtn');
  const historyList = document.getElementById('historyList');
  const historyEmpty = document.getElementById('historyEmpty');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  let codeReader;
  let currentMode = 'auto';       
  let cameraActive = false;

  function formatsForMode(mode) {
    const BF = ZXing.BarcodeFormat;
    if (mode === 'qr') return [BF.QR_CODE];
    if (mode === 'barcode') return [BF.EAN_13, BF.CODE_128, BF.UPC_A, BF.CODE_39];
    return [BF.QR_CODE, BF.EAN_13, BF.CODE_128, BF.UPC_A];
  }

  function buildReader(mode) {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatsForMode(mode));
    codeReader = new ZXing.BrowserMultiFormatReader(hints);
  }

  function safeReset() {
    if (codeReader) {
      try { codeReader.reset(); } catch (e) { }
    }
    if (videoEl.srcObject) {
      try { videoEl.srcObject.getTracks().forEach(t => t.stop()); } catch (e) { }
      videoEl.srcObject = null;
    }
    cameraActive = false;
    torchBtn.hidden = true;
    torchBtn.classList.remove('on');
  }

  function getVideoTrack() {
    const stream = videoEl.srcObject;
    return stream ? stream.getVideoTracks()[0] : null;
  }

  torchBtn.addEventListener('click', async () => {
    const track = getVideoTrack();
    if (!track) return;
    const isOn = torchBtn.classList.contains('on');
    try {
      await track.applyConstraints({ advanced: [{ torch: !isOn }] });
      torchBtn.classList.toggle('on', !isOn);
    } catch (e) { }
  });

  const tabPanels = { scan: scanTab, generate: generateTab, history: historyTab };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      tabButtons.forEach(b => b.classList.toggle('active', b === btn));
      Object.entries(tabPanels).forEach(([name, panel]) => {
        panel.hidden = name !== tab;
      });
      if (tab !== 'scan' && cameraActive) {
        safeReset();
        startCameraBtn.style.display = "block";
        startCameraBtn.disabled = false;
        startBtnLabel.textContent = "Scan";
        scanArea.style.display = "block";
        viewfinderWrap.classList.remove('scanning');
      }
      if (tab === 'history') renderHistory();
    });
  });

  const HISTORY_KEY = 'universalScannerHistory';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; }
  }

  function saveToHistory(decodedText, link) {
    try {
      const history = loadHistory();
      history.unshift({
        text: decodedText,
        type: link ? link.cssClass : 'text',
        label: link ? link.label : 'Text',
        time: Date.now()
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 100)));
    } catch (e) { }
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function renderHistory() {
    const history = loadHistory();
    if (history.length === 0) {
      historyList.innerHTML = "";
      historyEmpty.style.display = "block";
      return;
    }
    historyEmpty.style.display = "none";
    historyList.innerHTML = history.map((item, i) => `
      <div class="historyItem" data-index="${i}">
        <div class="historyTop">
          <span class="historyTypeBadge ${item.type}">${item.label}</span>
          <span class="historyTime">${timeAgo(item.time)}</span>
        </div>
        <div class="historyText">${escapeHtml(item.text)}</div>
      </div>
    `).join('');

    historyList.querySelectorAll('.historyItem').forEach(el => {
      el.addEventListener('click', () => {
        const item = history[parseInt(el.dataset.index, 10)];
        if (!item) return;
        navigator.clipboard.writeText(item.text);
        statusEl.textContent = "Copied to clipboard!";
      });
    });
  }

  clearHistoryBtn.addEventListener('click', () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  function drawGeneratedQr() {
    const text = genInput.value.trim();
    if (!text) return;
    
    qrCanvasContainer.innerHTML = '';
    try {
      const el = kjua({
        text: text,
        size: 240,
        fill: '#000000',
        back: '#ffffff',
        rounded: 100,
        quiet: 1
      });
      qrCanvasContainer.appendChild(el);
      genResult.hidden = false;
    } catch (err) {
      alert("Error generating QR code: " + err.message);
    }
  }
  genBtn.addEventListener('click', drawGeneratedQr);

  genDownloadBtn.addEventListener('click', () => {
    const imgOrCanvas = qrCanvasContainer.querySelector('canvas, img');
    if (!imgOrCanvas) return;
    const src = imgOrCanvas.tagName === 'CANVAS' ? imgOrCanvas.toDataURL() : imgOrCanvas.src;
    const a = document.createElement('a');
    a.download = 'qr-code.png';
    a.href = src;
    a.click();
  });

  genShareBtn.addEventListener('click', () => {
    if (navigator.share) {
      navigator.share({ text: genInput.value.trim() }).catch(() => {});
    } else {
      genDownloadBtn.click();
    }
  });

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      if (cameraActive) startScanner();
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function classifyLink(text) {
    const t = text.trim();
    if (/^upi:\/\//i.test(t)) return { url: t, label: "💳 Pay via UPI App", cssClass: "pay", appHint: "GPay, PhonePe, or Paytm", externalApp: true };
    if (/^tel:/i.test(t)) return { url: t, label: "📞 Call Number", cssClass: "call", appHint: "your phone dialer", externalApp: true };
    if (/^mailto:/i.test(t)) return { url: t, label: "📧 Send Email", cssClass: "mail", appHint: "your email app", externalApp: true };
    if (/^https?:\/\//i.test(t) || /^www\./i.test(t)) {
      const url = t.startsWith("http") ? t : "https://" + t;
      return { url: url, label: "🔗 Open Web Link", cssClass: "web", appHint: "your browser", externalApp: false };
    }
    return null;
  }

  let audioCtx = null;
  function ensureAudioReady() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      else if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { }
  }

  function playFoundSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1046.5, now);
    osc.frequency.exponentialRampToValueAtTime(1568.0, now + 0.12);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  function playFoundHaptic() {
    try { if (navigator.vibrate) navigator.vibrate([15, 30, 40]); } catch (e) { }
  }

  // FIXED DEEP LINK TRIGGER (Prevents net::ERR_UNKNOWN_URL_SCHEME error)
  window.triggerDeepLink = function(url) {
    try {
      // Create hidden iframe to trigger OS app chooser without navigating browser window
      let iframe = document.getElementById('deepLinkIframe');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'deepLinkIframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }
      iframe.src = url;

      // Fallback location trigger after short delay if iframe trigger is blocked
      setTimeout(() => {
        window.location.assign(url);
      }, 300);
    } catch(e) {
      window.location.href = url;
    }
  };

  function triggerPaytm3dEffect(decodedText) {
    safeReset();
    playFoundSound();
    playFoundHaptic();

    const canvas = document.createElement('canvas');
    canvas.width = viewfinderWrap.clientWidth;
    canvas.height = viewfinderWrap.clientHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL();

    paytm3dStage.innerHTML = '';
    const gridRows = 5;
    const gridCols = 5;
    const fragW = canvas.width / gridCols;
    const fragH = canvas.height / gridRows;

    const fragments = [];

    for (let r = 0; r < gridRows; r++) {
      for (let c = 0; c < gridCols; c++) {
        const frag = document.createElement('div');
        frag.className = 'qrFragment';
        frag.style.width = `${fragW}px`;
        frag.style.height = `${fragH}px`;
        frag.style.left = `${c * fragW}px`;
        frag.style.top = `${r * fragH}px`;
        frag.style.backgroundImage = `url(${dataUrl})`;
        frag.style.backgroundPosition = `-${c * fragW}px -${r * fragH}px`;
        paytm3dStage.appendChild(frag);
        fragments.push({ el: frag, r, c });
      }
    }

    setTimeout(() => {
      fragments.forEach(f => {
        const moveX = (f.c - 2) * 85;
        const moveY = (f.r - 2) * 85;
        const rotateX = (Math.random() - 0.5) * 260;
        const rotateY = (Math.random() - 0.5) * 260;
        f.el.style.transform = `translate3d(${moveX}px, ${moveY}px, 600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.6)`;
        f.el.style.opacity = '0';
      });
    }, 20);

    setTimeout(() => {
      paytm3dStage.innerHTML = '';
      revealResult(decodedText);
    }, 1100);
  }

  function revealResult(decodedText) {
    const link = classifyLink(decodedText);
    saveToHistory(decodedText, link);

    if (link) {
      const badge = link.cssClass === "pay"
        ? `<div class="verifyBadge"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#2563eb"/><path d="M7.5 12.5L10.5 15.5L16.5 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>UPI Payment Code Detected</div>`
        : "";

      const actionBtnMarkup = link.externalApp
        ? `<button class="actionBtn ${link.cssClass}" type="button" onclick="triggerDeepLink('${escapeHtml(link.url)}')">${link.label}</button>`
        : `<a class="actionBtn ${link.cssClass}" href="${escapeHtml(link.url)}" target="_blank" rel="noopener">${link.label}</a>`;

      resultContent.innerHTML =
        badge +
        actionBtnMarkup +
        `<button class="copyBtn" id="copyBtn" type="button">📋 Copy Link</button>` +
        `<p class="hintText">If tapping doesn't open anything, copy the link and paste it into ${link.appHint}.</p>` +
        `<div class="rawLink">${escapeHtml(decodedText)}</div>`;

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(link.url).then(() => {
          copyBtn.textContent = "✅ Copied!";
          setTimeout(() => { copyBtn.textContent = "📋 Copy Link"; }, 1500);
        });
      });
    } else {
      resultContent.innerHTML = `<pre>${escapeHtml(decodedText)}</pre>`;
    }

    // Hide scan container to clear screen view
    scanArea.style.display = "none";

    dashboard.hidden = false;
    dashboard.classList.remove('flipIn');
    void dashboard.offsetWidth;
    dashboard.classList.add('flipIn');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function startScanner() {
    if (typeof ZXing === "undefined") {
      statusEl.textContent = "Scanner library failed to load. Check internet connection.";
      return;
    }

    safeReset();
    buildReader(currentMode);

    dashboard.hidden = true;
    scanArea.style.display = "block";
    startCameraBtn.disabled = true;
    startBtnLabel.textContent = "Starting…";
    statusEl.textContent = "Requesting camera access…";

    const constraints = {
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      }
    };

    try {
      await codeReader.decodeFromConstraints(
        constraints,
        videoEl,
        (result, err) => {
          if (result) {
            triggerPaytm3dEffect(result.getText());
          }
        }
      );

      const track = getVideoTrack();
      if (track && track.getCapabilities) {
        try {
          const caps = track.getCapabilities();
          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
        } catch (e) { }
      }

      cameraActive = true;
      startCameraBtn.style.display = "none";
      viewfinderWrap.classList.add('scanning');
      statusEl.textContent = "Point your camera at a QR code or barcode…";
    } catch (err) {
      startCameraBtn.disabled = false;
      startBtnLabel.textContent = "Scan";
      statusEl.textContent = "Camera access failed: " + err;
    }
  }

  startCameraBtn.addEventListener('click', () => { ensureAudioReady(); startScanner(); });
  document.getElementById('scanAgainBtn').addEventListener('click', () => {
    startCameraBtn.style.display = "block";
    startCameraBtn.disabled = false;
    startBtnLabel.textContent = "Scan";
    dashboard.hidden = true;
    scanArea.style.display = "block";
    startScanner();
  });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusEl.textContent = "Scanning photo…";
    const url = URL.createObjectURL(file);
    try {
      buildReader(currentMode);
      const result = await codeReader.decodeFromImageUrl(url);
      URL.revokeObjectURL(url);
      playFoundSound();
      playFoundHaptic();
      revealResult(result.getText());
    } catch (err) {
      URL.revokeObjectURL(url);
      statusEl.textContent = "Couldn't find a valid code in that image.";
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => { });
    });
  }
</script>
